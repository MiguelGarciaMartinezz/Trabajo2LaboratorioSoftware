<!DOCTYPE html>
<html lang="es" ng-app="adminApp">
<head>
    <meta charset="UTF-8">
    <title>Gestor Multimedia - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 12px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .navbar { background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    </style>
</head>
<body ng-controller="AdminController">

    <nav class="navbar navbar-light sticky-top mb-4 py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="#">Gestor Multimedia</a>
            <div class="d-flex gap-3 align-items-center">
                <span class="fw-bold text-muted">Administrador: {{ usuarioActual }}</span>
                <button class="btn btn-outline-danger btn-sm rounded-pill fw-bold" ng-click="logout()">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            
            <div class="col-12 mb-4">
                <div class="card p-4">
                    <h4 class="fw-bold text-primary mb-3">Gestión de Usuarios</h4>
                    <form class="row g-2 mb-3" ng-submit="crearUsuario()">
                        <div class="col-md-3">
                            <input type="text" class="form-control" ng-model="nuevoUser.name" placeholder="Nombre" required>
                        </div>
                        <div class="col-md-4">
                            <input type="email" class="form-control" ng-model="nuevoUser.email" placeholder="Email" required>
                        </div>
                        <div class="col-md-3">
                            <input type="password" class="form-control" ng-model="nuevoUser.passwd" placeholder="Contraseña" required>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-success w-100">+ Añadir</button>
                        </div>
                    </form>

                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Nombre</th>
                                    <th>Email</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="u in usuarios">
                                    <td class="fw-bold">{{ u.name }}</td>
                                    <td>{{ u.email }}</td>
                                    <td>
                                        <button class="btn btn-sm btn-primary me-1" ng-click="editarUsuario(u)">✏️ Editar</button>
                                        <button class="btn btn-sm btn-danger" ng-click="borrarUsuario(u.id, $index)">🗑️ Borrar</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-4">
                <div class="card p-3 h-100">
                    <h4 class="fw-bold text-primary mb-3">Categorías</h4>
                    <form class="d-flex gap-2 mb-3" ng-submit="crearCategoria()">
                        <input type="text" class="form-control form-control-sm" ng-model="nuevaCatNombre" placeholder="Nombre categoría..." required>
                        <button type="submit" class="btn btn-sm btn-success">+ Añadir</button>
                    </form>

                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center" ng-repeat="cat in categorias">
                            {{ cat.nombre }}
                            <div>
                                <button class="btn btn-sm btn-primary me-1" ng-click="editarCategoria(cat)">✏️</button>
                                <button class="btn btn-sm btn-danger" ng-click="borrarCategoria(cat.nombre, $index)">🗑️</button>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="col-md-8 mb-4">
                <div class="card p-3 h-100">
                    <h4 class="fw-bold text-primary mb-3">Vídeos</h4>
                    <form class="row g-2 mb-3" ng-submit="crearVideo()">
                        <div class="col-md-4">
                            <input type="text" class="form-control form-control-sm" ng-model="nuevoVideo.titulo" placeholder="Título del vídeo" required>
                        </div>
                        <div class="col-md-3">
                            <input type="url" class="form-control form-control-sm" ng-model="nuevoVideo.url" placeholder="URL (ej: http...)" required>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select form-select-sm" ng-model="nuevoVideo.categoria" required>
                                <option value="" disabled selected>Categoría...</option>
                                <option ng-repeat="c in categorias" value="{{c.nombre}}">{{c.nombre}}</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-sm btn-success w-100">+ Añadir</button>
                        </div>
                    </form>

                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Título</th>
                                    <th>Enlace</th>
                                    <th>Categoría</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="vid in videos">
                                    <td class="fw-bold">{{ vid.titulo }}</td>
                                    <td><a href="{{ vid.url }}" target="_blank">Ver enlace</a></td>
                                    <td><span class="badge bg-secondary">{{ vid.categoria_nombre }}</span></td>
                                    <td>
                                        <button class="btn btn-sm btn-primary me-1" ng-click="editarVideo(vid)">✏️ Editar</button>
                                        <button class="btn btn-sm btn-danger" ng-click="borrarVideo(vid.id, $index)">🗑️ Borrar</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
