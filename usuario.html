<!DOCTYPE html>
<html lang="es" ng-app="usuarioApp">
<head>
    <meta charset="UTF-8">
    <title>Gestor Multimedia - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-controller="UsuarioController">

    <nav class="navbar navbar-light sticky-top mb-5 py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="#">Gestor Multimedia</a>
            <div class="d-flex gap-3 align-items-center">
                <span class="fw-bold text-muted">Hola, {{ usuarioActual }}</span>
                <button class="btn btn-outline-danger btn-sm rounded-pill fw-bold" ng-click="logout()">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container">
        
        <div class="mb-5">
            <h2 class="fw-bold text-dark">Catálogo de Vídeos</h2>
            <p class="text-muted fs-5">Explora todo el contenido agrupado por categorías.</p>
        </div>

        <div ng-repeat="cat in categorias" class="mb-5 pb-3">
            <h3 class="fw-bold text-dark categoria-titulo">{{ cat.nombre }}</h3>
            
            <div class="row">
                <div class="col-md-4 mb-4" ng-repeat="vid in videos | filter:{categoria_nombre: cat.nombre}">
                    <div class="card h-100 video-card">
                        
                        <div class="video-thumbnail" ng-style="{'background-image': 'url(' + obtenerMiniatura(vid.url) + ')'}"></div>
                        
                        <div class="card-body d-flex flex-column p-4">
                            <h5 class="fw-bold text-dark mb-4">{{ vid.titulo }}</h5>
                            <a href="{{ vid.url }}" target="_blank" class="btn btn-primary w-100 mt-auto fw-bold">Ver Vídeo</a>
                        </div>
                    </div>
                </div>

                <div class="col-12 text-muted fst-italic" ng-if="(videos | filter:{categoria_nombre: cat.nombre}).length === 0">
                    Aún no hay vídeos en esta categoría.
                </div>
            </div>
        </div>
    </div>

    <script src="js/usuario.js"></script>
</body>
</html>
