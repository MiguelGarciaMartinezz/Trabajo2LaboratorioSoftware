<!DOCTYPE html>
<html lang="es" ng-app="gestorApp">
<head>
    <meta charset="UTF-8">
    <title>Gestor Multimedia - Login</title>
    <!-- Referencia a Bootstrap (Estilo de los botones), nuestra hoja de estilo y AngularJS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<!-- estilo para centrar el formulario de login en la pantalla  -->
<body class="vh-100 d-flex align-items-center justify-content-center" ng-controller="LoginController">
    <!-- Creación de la caja -->
    <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%;">
        <h2 class="text-center fw-bold text-primary mb-4">Gestor Multimedia</h2>
        <!-- ng-submit el como poner onlick pero de angular. Al pulsar el boton ejecuta hacerlogin() que se encuentra en login.js -->
        <form ng-submit="hacerLogin()">
            <div class="mb-3">
                <input type="text" class="form-control" placeholder="Usuario o Email" ng-model="usuario.user" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" placeholder="Contraseña" ng-model="usuario.passwd" required>
            </div>
            <!-- Al pulsar el boton de entrar se ejecuta el ng-submit -->
            <button type="submit" class="btn btn-primary w-100 fw-bold">Entrar</button>
        </form>
        
        <div class="alert alert-danger mt-3" ng-show="mensajeError">
            {{ mensajeError }}
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
